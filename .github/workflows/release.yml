name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Run CI checks before building releases
  ci:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --verbose

  build:
    name: Build ${{ matrix.target }}
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create archive
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../go-again-${{ matrix.target }}.tar.gz go-again
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-again-${{ matrix.target }}
          path: go-again-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir release
          mv artifacts/go-again-x86_64-apple-darwin/go-again-x86_64-apple-darwin.tar.gz release/
          mv artifacts/go-again-aarch64-apple-darwin/go-again-aarch64-apple-darwin.tar.gz release/
          mv artifacts/go-again-x86_64-unknown-linux-gnu/go-again-x86_64-unknown-linux-gnu.tar.gz release/
          mv artifacts/go-again-aarch64-unknown-linux-gnu/go-again-aarch64-unknown-linux-gnu.tar.gz release/

      - name: Generate checksums
        run: |
          cd release
          shasum -a 256 *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/checksums.txt
          generate_release_notes: true

  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Calculate SHA256
        id: sha
        run: |
          SHA_X86=$(shasum -a 256 artifacts/go-again-x86_64-apple-darwin/go-again-x86_64-apple-darwin.tar.gz | cut -d ' ' -f 1)
          SHA_ARM=$(shasum -a 256 artifacts/go-again-aarch64-apple-darwin/go-again-aarch64-apple-darwin.tar.gz | cut -d ' ' -f 1)
          echo "sha_x86=$SHA_X86" >> $GITHUB_OUTPUT
          echo "sha_arm=$SHA_ARM" >> $GITHUB_OUTPUT

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: danielmschmidt/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          cat > homebrew-tap/Formula/go-again.rb << 'EOF'
          class GoAgain < Formula
            desc "Go development helper for re-running failed tests"
            homepage "https://github.com/danielmschmidt/go-again"
            version "${{ steps.version.outputs.version }}"
            license "MIT"

            on_macos do
              on_intel do
                url "https://github.com/danielmschmidt/go-again/releases/download/v${{ steps.version.outputs.version }}/go-again-x86_64-apple-darwin.tar.gz"
                sha256 "${{ steps.sha.outputs.sha_x86 }}"
              end

              on_arm do
                url "https://github.com/danielmschmidt/go-again/releases/download/v${{ steps.version.outputs.version }}/go-again-aarch64-apple-darwin.tar.gz"
                sha256 "${{ steps.sha.outputs.sha_arm }}"
              end
            end

            def install
              bin.install "go-again"
            end

            test do
              system "#{bin}/go-again", "--help"
            end
          end
          EOF

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/go-again.rb
          git commit -m "Update go-again to v${{ steps.version.outputs.version }}"
          git push
